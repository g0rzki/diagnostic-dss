rules:
  - id: G2-01
    name: ścieżka bez biopsji możliwa – omów z pacjentem
    group: G2
    level: rekomendacja
    uses: [P1, P2, P3, P4, P7, P11, P12, P13, P15]
    condition_text: >-
      ścieżka bez biopsji dostępna (D4) i zgoda pacjenta nieomówiona (P12 = nie omówiono)
    condition:
      all:
        - [D4, '=', true]
        - [P12, '=', nie omówiono]
    conclusion: >-
      Spełnione są warunki wstępne ścieżki bez biopsji (anty-TG2 IgA ≥ 10 × GGN, wiek < 45
      lat, brak objawów alarmowych, dieta z glutenem). Omów z pacjentem korzyści i
      ograniczenia pominięcia biopsji dwunastnicy. Decyzję o pominięciu endoskopii i
      potwierdzenie rozpoznania podejmuje się w opiece specjalistycznej.
    source:
      ref: esscd1
      location: Q.IV.1.2, kluczowe uwagi (s. 1870) + uzasadnienie (s. 1871)
      page: 1870
      kind: zalecenie
      grade: {certainty: nie dotyczy, strength: dobra praktyka (UGPS), agreement: 95}
    ptge:
      status: zgodność
      pages: [7]

  - id: G2-02
    name: zgoda na ścieżkę bez biopsji – oznacz anty-TG2 IgA w drugiej próbce
    group: G2
    level: rekomendacja
    uses: [P1, P2, P3, P4, P5, P7, P11, P12, P13, P15]
    condition_text: >-
      ścieżka bez biopsji dostępna (D4), zgoda pacjenta (P12 = tak) i brak wyniku drugiej
      próbki (P5)
    condition:
      all:
        - [D4, '=', true]
        - [P12, '=', tak]
        - [P5, '=', null]
    conclusion: >-
      Oznacz anty-TG2 IgA w drugiej, niezależnie pobranej próbce krwi. Do potwierdzenia
      pacjent pozostaje na diecie zawierającej gluten.
    source:
      ref: esscd1
      location: Q.IV.1.2, kluczowe uwagi (s. 1870) + uzasadnienie (s. 1871)
      page: 1870
      kind: zalecenie
      grade: {certainty: nie dotyczy, strength: opinia ekspercka, agreement: 95}
    ptge:
      status: zgodność
      pages: [5]

  - id: G2-03
    name: druga próbka dodatnia – rozpoznanie bez biopsji
    group: G2
    level: rekomendacja
    uses: [P1, P2, P3, P4, P5, P6, P7, P11, P12, P13, P15]
    condition_text: >-
      ścieżka bez biopsji dostępna (D4), zgoda pacjenta (P12 = tak) i druga próbka dodatnia
      (D1, P5 > P6)
    condition:
      all:
        - [D4, '=', true]
        - [P12, '=', tak]
        - [D1_2, '=', dodatni]
    conclusion: >-
      Spełnione są kryteria rozpoznania celiakii bez biopsji: anty-TG2 IgA ≥ 10 × GGN w
      pierwszym oznaczeniu i wynik dodatni w drugiej, niezależnej próbce. Rozpoznanie można
      potwierdzić bez biopsji dwunastnicy; potwierdzenie rozpoznania należy do opieki
      specjalistycznej.
    source:
      ref: esscd1
      location: Q.IV.1.2 (zalecenie) + kluczowe uwagi
      page: 1870
      kind: zalecenie
      grade: {certainty: umiarkowana, strength: warunkowe, agreement: 95}
    ptge:
      status: zgodność
      pages: [9]

  - id: G2-04
    name: druga próbka dodatnia poniżej 10 × GGN – niejednoznaczność źródła
    group: G2
    level: informacja
    uses: [P1, P2, P3, P4, P5, P6, P7, P11, P12, P13, P15]
    condition_text: >-
      ścieżka bez biopsji dostępna (D4), zgoda pacjenta (P12 = tak), druga próbka dodatnia
      (D1, P5 > P6) i poniżej 10 × GGN (P5 < 10 × P6)
    condition:
      all:
        - [D4, '=', true]
        - [P12, '=', tak]
        - [D1_2, '=', dodatni]
        - [D2_2, '=', false]
    conclusion: >-
      Druga próbka jest dodatnia, ale poniżej 10 × GGN. Kluczowe uwagi do zalecenia ESsCD
      uznają każdy wynik dodatni za potwierdzający, natomiast uzasadnienie warunkowo zaleca
      drugi pomiar ≥ 10 × GGN; nie ma bezpośrednich dowodów korzyści z powtórzenia badania.
      Ocena należy do lekarza.
    source:
      ref: esscd1
      location: Q.IV.1.2, kluczowe uwagi (s. 1870) + uzasadnienie (s. 1871)
      page: 1870
      kind: zalecenie
    ptge:
      status: zgodność
      pages: [5]

  - id: G2-05
    name: druga próbka ujemna – brak potwierdzenia, biopsja
    group: G2
    level: rekomendacja
    uses: [P1, P2, P3, P4, P5, P6, P7, P11, P12, P13, P15]
    condition_text: >-
      ścieżka bez biopsji dostępna (D4), zgoda pacjenta (P12 = tak) i druga próbka ujemna (D1,
      P5 ≤ P6)
    condition:
      all:
        - [D4, '=', true]
        - [P12, '=', tak]
        - [D1_2, '=', ujemny]
    conclusion: >-
      Druga próbka nie potwierdziła wyniku – rozpoznanie bez biopsji nie jest możliwe.
      Wskazana gastroduodenoskopia z pobraniem wycinków z dwunastnicy.
    source:
      ref: esscd1
      location: Q.IV.1.2, kluczowe uwagi + Q.IV.1.1 (zalecenie)
      page: 1870
      kind: zalecenie
      grade: {certainty: nie dotyczy, strength: opinia ekspercka, agreement: 95}
    ptge:
      status: zgodność
      pages: [5]

  - id: G2-06
    name: brak zgody na ścieżkę bez biopsji – biopsja
    group: G2
    level: rekomendacja
    uses: [P1, P2, P3, P4, P7, P11, P12, P13, P15]
    condition_text: >-
      ścieżka bez biopsji dostępna (D4) i brak zgody pacjenta (P12 = nie)
    condition:
      all:
        - [D4, '=', true]
        - [P12, '=', nie]
    conclusion: >-
      Pacjent nie wyraził zgody na rozpoznanie bez biopsji. Wskazana gastroduodenoskopia z
      pobraniem wycinków z dwunastnicy.
    source:
      ref: esscd1
      location: Q.IV.1.2, kluczowe uwagi + Q.IV.1.1 (zalecenie)
      page: 1870
      kind: zalecenie
      grade: {certainty: nie dotyczy, strength: dobra praktyka (UGPS), agreement: 95}
    ptge:
      status: zgodność
      pages: [5, 7, 10]

  - id: G2-07
    name: wiek ≥ 45 lat – ścieżka bez biopsji nie ma zastosowania
    group: G2
    level: rekomendacja
    uses: [P1, P3, P4, P13, P16]
    condition_text: >-
      wysokie miano anty-TG2 IgA (D2), wiek ≥ 45 lat (P1), histologia niewykonana (P13 = nie
      wykonano) i prowokacja glutenem niezakończona (P16 ≠ tak)
    condition:
      all:
        - [D2, '=', true]
        - [P1, ≥, 45]
        - [P13, '=', nie wykonano]
        - [P16, ≠, true]
    conclusion: >-
      U pacjenta w wieku ≥ 45 lat rozpoznanie bez biopsji nie ma zastosowania mimo wysokiego
      miana anty-TG2 IgA. Wskazana gastroduodenoskopia z pobraniem wycinków z dwunastnicy.
    source:
      ref: esscd1
      location: Q.IV.1.2, kluczowe uwagi (s. 1870) + uzasadnienie (s. 1871)
      page: 1870
      kind: zalecenie
      grade: {certainty: niska, strength: opinia ekspercka, agreement: 95}
    ptge:
      status: zgodność
      pages: [9]

  - id: G2-08
    name: objawy alarmowe – ścieżka bez biopsji nie ma zastosowania
    group: G2
    level: rekomendacja
    uses: [P3, P4, P11, P13, P16]
    condition_text: >-
      wysokie miano anty-TG2 IgA (D2), objawy alarmowe (P11), histologia niewykonana (P13 =
      nie wykonano) i prowokacja glutenem niezakończona (P16 ≠ tak)
    condition:
      all:
        - [D2, '=', true]
        - [P11, '=', true]
        - [P13, '=', nie wykonano]
        - [P16, ≠, true]
    conclusion: >-
      Objawy alarmowe mogą wskazywać na inną chorobę – rozpoznanie bez biopsji nie ma
      zastosowania mimo wysokiego miana anty-TG2 IgA. Wskazana gastroduodenoskopia z pobraniem
      wycinków z dwunastnicy.
    source:
      ref: esscd1
      location: Q.IV.1.2, kluczowe uwagi (s. 1870) + uzasadnienie (s. 1871)
      page: 1870
      kind: zalecenie
      grade: {certainty: nie dotyczy, strength: dobra praktyka (UGPS), agreement: 95}
    ptge:
      status: zgodność
      pages: [5]

  - id: G2-09
    name: wysokie miano przy ograniczonym glutenie – rozbieżność wytycznych
    group: G2
    level: informacja
    uses: [P1, P2, P3, P4, P7, P11, P13, P15, P16]
    condition_text: >-
      wysokie miano anty-TG2 IgA (D2), spożycie glutenu ograniczone (P2), prowokacja
      niezakończona (P16 = nie), wiek < 45 lat (P1), brak objawów alarmowych (P11), histologia
      niewykonana (P13 = nie wykonano), brak całkowitego niedoboru IgA (D3) i HLA nie ujemne
      (P15 ≠ ujemny)
    condition:
      all:
        - [D2, '=', true]
        - [P2, '=', ograniczone]
        - [P16, '=', false]
        - [P1, <, 45]
        - [P11, '=', false]
        - [P13, '=', nie wykonano]
        - [D3, ≠, całkowity]
        - [P15, ≠, ujemny]
    conclusion: >-
      Kluczowe uwagi ESsCD wymagają, aby do potwierdzenia na drugiej próbce pacjent pozostawał
      na diecie zawierającej gluten; uzasadnienie ESsCD wymienia wcześniejsze ograniczenie
      glutenu wśród czynników przemawiających za elastycznością przy powtórnym oznaczeniu.
      PTG-E dopuszcza rozważenie rozpoznania bez biopsji, gdy pacjent z powodu nasilonych
      objawów rozpoczął dietę bezglutenową po badaniu przeciwciał, a przed endoskopią.
      Wytyczne różnią się – decyzja należy do lekarza.
    source:
      ref: esscd1
      location: Q.IV.1.2, kluczowe uwagi (s. 1870) + uzasadnienie (s. 1871)
      page: 1870
      kind: zalecenie
    ptge:
      status: różnica
      pages: [7]

  - id: G2-10
    name: wysokie miano przy ujemnym HLA-DQ2/DQ8 – rozpoznanie bez biopsji nie ma zastosowania
    group: G2
    level: informacja
    uses: [P3, P4, P7, P13, P15, P16]
    condition_text: >-
      wysokie miano anty-TG2 IgA (D2), HLA-DQ2/DQ8 ujemne (P15), brak całkowitego niedoboru
      IgA (D3), histologia niewykonana (P13 = nie wykonano) i prowokacja glutenem
      niezakończona (P16 ≠ tak)
    condition:
      all:
        - [D2, '=', true]
        - [P15, '=', ujemny]
        - [D3, ≠, całkowity]
        - [P13, '=', nie wykonano]
        - [P16, ≠, true]
    conclusion: >-
      Wysokie miano anty-TG2 IgA przy ujemnym HLA-DQ2/DQ8 – wyniki są rozbieżne. Ujemne HLA
      praktycznie wyklucza celiakię, a miano powyżej 10 × GGN silnie przewiduje zanik kosmków
      zwłaszcza u nosicieli HLA-DQ2/DQ8. Rozpoznanie bez biopsji nie ma tu zastosowania –
      rozstrzyga gastroduodenoskopia z oceną histologiczną.
    source:
      ref: esscd1
      location: Q.IV.8, kluczowe uwagi (s. 1875); uzasadnienie Q.IV.2 (s. 1872); streszczenie (s. 1856); Q.IV.1.1 (s. 1870)
      page: 1875
      kind: zalecenie
    ptge:
      status: brak odniesienia
