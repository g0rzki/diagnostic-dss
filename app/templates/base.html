<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Diagnostic DSS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-800">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-4xl px-4 py-4">
      <a href="{{ url_for('main.index') }}" class="text-lg font-semibold text-teal-700">Diagnostic DSS</a>
    </div>
  </header>

  <main class="mx-auto w-full max-w-4xl flex-1 px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <p class="mx-auto max-w-4xl px-4 py-3 text-center text-sm text-slate-500">
      Prototyp systemu wspomagania decyzji. Nie zastępuje decyzji lekarza.
    </p>
  </footer>
</body>
</html>
