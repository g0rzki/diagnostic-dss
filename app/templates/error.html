{% extends "base.html" %}

{% block title %}{{ title }} | Diagnostic DSS{% endblock %}

{% block content %}
<p class="text-sm font-medium text-slate-500">Błąd {{ code }}</p>
<h1 class="mt-1 text-2xl font-semibold">{{ title }}</h1>
<p class="mt-2 text-slate-600">{{ message }}</p>
<div class="mt-6 flex flex-wrap gap-3">

  <a href="{{ url_for('main.consultation_form') }}" class="btn-secondary">Nowa konsultacja</a>
</div>
{% endblock %}
