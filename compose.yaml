services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dss}
      POSTGRES_DB: ${POSTGRES_DB:-dss}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: gunicorn --bind 0.0.0.0:8000 --reload "app:create_app()"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dss}
      POSTGRES_DB: ${POSTGRES_DB:-dss}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FLASK_DEBUG: 1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: docker/frontend
    command: tailwindcss -i app/static/css/input.css -o app/static/css/output.css --watch=always
    volumes:
      - ./app:/app/app

volumes:
  pgdata:
